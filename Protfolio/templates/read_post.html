{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}

<div class="community-page">

    <article class="read-post">

        <!-- Post Header -->
        <header class="read-post-header">

            <div class="read-post-category">
                🧪 Chem Society
            </div>

            <h1>{{ post.title }}</h1>

            <div class="read-post-meta">
                📖 Community Post
            </div>

        </header>


        <!-- Post Content -->
        <div class="read-post-content">

            {{ post.content }}

        </div>


        <!-- Bottom Actions -->
        <div class="community-actions read-post-actions">

            <a href="/community" class="community-btn secondary">
                ← Back to Community
            </a>

           

        </div>

    </article>

</div>


<style>

    /* =========================
       Read Post
    ========================= */

    .read-post {
        max-width: 800px;
        margin: 40px auto;
        padding: 40px;

        background: #fff;

        border: 1px solid #e9e9e9;
        border-radius: 20px;

        box-sizing: border-box;
    }


    /* Header */

    .read-post-header {
        padding-bottom: 25px;
        margin-bottom: 30px;

        border-bottom: 1px solid #e9e9e9;
    }

    .read-post-category {
        margin-bottom: 15px;

        font-size: 0.9rem;
        font-weight: 600;

        opacity: 0.7;
    }

    .read-post-header h1 {
        margin: 0;

        font-size: 2.4rem;
        line-height: 1.25;
    }

    .read-post-meta {
        margin-top: 15px;

        font-size: 0.9rem;
        opacity: 0.6;
    }


    /* Content */

    .read-post-content {
        font-size: 1.08rem;
        line-height: 1.9;

        white-space: pre-wrap;
        overflow-wrap: break-word;
    }


    /* Actions */

    .read-post-actions {
        margin-top: 40px;
        padding-top: 25px;

        border-top: 1px solid #e9e9e9;

        display: flex;
        justify-content: space-between;
        gap: 12px;
    }


    /* Responsive */

    @media (max-width: 650px) {

        .read-post {
            margin: 20px 14px;
            padding: 25px 20px;

            border-radius: 16px;
        }

        .read-post-header h1 {
            font-size: 1.8rem;
        }

        .read-post-content {
            font-size: 1rem;
            line-height: 1.75;
        }

        .read-post-actions {
            flex-direction: column;
        }

        .read-post-actions .community-btn {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

    }

</style>

{% endblock %}
